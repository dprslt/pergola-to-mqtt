; pergola-to-mqtt -- MQTT daemon
;
;   cp .env.example .env   and fill it in
;   pio run -t upload
;   pio device monitor
;
; The CC1101 driver, the EV1527 codec and this pergola's codes all come from
; firmware/common/, shared with firmware/sniffer/. PubSubClient is the one
; external dependency: writing an MQTT client by hand buys nothing here, unlike
; the radio driver where knowing every register mattered.
;
; WiFi and broker credentials are not in this tree. scripts/inject_secrets.py
; reads them from .env (gitignored) or the environment into a generated header
; under .pio/, so a public repo never carries them. The build fails with a named
; list if any required one is absent. That script explains why a generated
; header and not -D flags -- the -D route silently eats $ in a password.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_extra_dirs = ../common
extra_scripts = pre:scripts/inject_secrets.py
lib_deps = knolleary/PubSubClient@^2.8

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter
