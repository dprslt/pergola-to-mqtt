; pergola-to-mqtt -- MQTT daemon
;
;   cp .env.example .env   and fill it in
;   pio run -t upload
;   pio device monitor
;
; The CC1101 driver, the EV1527 codec and this pergola's codes all come from
; firmware/common/, shared with firmware/sniffer/. PubSubClient is the one
; external dependency: writing an MQTT client by hand buys nothing here, unlike
; the radio driver where knowing every register mattered.
;
; WiFi and broker credentials are not in this tree. scripts/inject_secrets.py
; reads them from .env (gitignored) or the environment into a generated header
; under .pio/, so a public repo never carries them. The build fails with a named
; list if any required one is absent. That script explains why a generated
; header and not -D flags -- the -D route silently eats $ in a password.

; The platform is pinned. Two reasons, both learned here: the watchdog bring-up in
; src/main.cpp has an #if ESP_IDF_VERSION_MAJOR >= 5 branch that no build on this
; pin ever compiles (7.0.1 is Arduino core 2.0.17 / IDF 4.4), so an unpinned bump to
; a core 3 would silently take an untested path on a device that moves a roof; and
; the CC1101 driver bit-bangs microsecond timings, which is exactly the kind of code
; a framework change perturbs quietly. Bump deliberately, then re-test on hardware.
[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

lib_extra_dirs = ../common
extra_scripts = pre:scripts/inject_secrets.py
lib_deps = knolleary/PubSubClient@^2.8

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter

; Over-the-air uploads. Same build, different upload transport:
;
;   .venv/bin/pio run -d firmware/daemon -e esp32dev-ota -t upload
;
; The password is not on that command line. inject_secrets.py already resolves
; PERGOLA_OTA_PASSWORD for the firmware, so it appends the matching --auth here
; too -- one secret, one place, and nothing pasted into shell history.
;
; upload_port defaults to the mDNS name ArduinoOTA registers. Override with
; --upload-port <ip> if .local does not resolve on your machine.
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = pergola.local
; Both, and in this order. extends would inherit the pre: script alone, and the
; --auth flag has to be appended after the platform configures the upload target.
extra_scripts =
	pre:scripts/inject_secrets.py
	post:scripts/ota_auth.py

; Watchdog self-test build. Adds a pergola/selftest/set topic that can wedge loop()
; on purpose, which is the only way to prove the task watchdog actually fires --
; nothing in the real daemon blocks for more than a ~540 ms transmit.
;
;   .venv/bin/pio run -d firmware/daemon -e esp32dev-selftest -t upload
;   cd tools && python3 hwtest_daemon.py --case watchdog
;   cd tools && python3 hwtest_daemon.py --case watchdog-recovery
;   .venv/bin/pio run -d firmware/daemon -e esp32dev-ota -t upload   # put it back
;
; Never leave this on the pergola. It announces itself at every boot.
[env:esp32dev-selftest]
extends = env:esp32dev-ota
build_flags =
	${env:esp32dev.build_flags}
	-DPERGOLA_WDT_SELFTEST
