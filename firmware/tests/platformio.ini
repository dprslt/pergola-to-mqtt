; Host tests for firmware/common. No board, no toolchain for the ESP32, no flashing.
;
;   .venv/bin/pio test -d firmware/tests
;
; This exists because the cover state machine is pure logic over stdint.h -- it
; deliberately knows nothing about radios or networks -- so it can be compiled and
; tested on the machine you are sitting at. It went untested for a while and a real
; bug reached the roof as a result: the auto-stop delay was derived from the believed
; position, so a stale belief of "already open" scheduled the stop 500 ms after the
; open and the roof twitched instead of moving. That is a two-line unit test.
[env:native]
platform = native
lib_extra_dirs = ../common
; Only the pergola library is portable; cc1101 and sniffer need the Arduino core.
lib_deps = pergola
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
