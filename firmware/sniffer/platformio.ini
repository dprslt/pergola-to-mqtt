; pergola-to-mqtt -- 433 MHz OOK sniffer
;
;   pio run -t upload      flash it
;   pio device monitor     watch frames (115200 baud)
;
; No external lib_deps on purpose: the CC1101 driver lives in this repo so that
; every register it writes is the one documented in docs/cc1101/, and so a library
; update can never silently change the radio configuration underneath a capture.
;
; It now lives in firmware/common/ rather than here, because firmware/daemon/
; drives the same radio with the same registers and duplicating the driver is how
; the two silently drift apart.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_extra_dirs = ../common

monitor_speed = 115200
monitor_filters = direct

; The frame lines are long. Raising this to 460800 roughly quadruples how much
; capture you can stream without the ring buffer dropping edges -- change
; monitor_speed and Serial.begin() together, and pass --baud to the host tools.
upload_speed = 921600

build_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter
